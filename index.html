<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salad shaker</title>
<meta name="description" content="Tryk på Shake og få en tilfældig salat med én ingrediens fra hver kategori.">
<meta name="theme-color" content="#EEF3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111915" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--INDHOLD-START-->
  <div class="side">
  <main class="hoved">
    <section class="skaal-kort" aria-label="Din salat">
      <header class="top">
        <h1>Salad shaker</h1>
        <p class="intro">Tryk på Shake, så vælger vi én ingrediens fra hver kategori.</p>
      </header>
      <svg id="skaal" class="skaal" viewBox="14 -138 372 428" role="img" aria-labelledby="skaal-titel">
        <title id="skaal-titel">En kok ryster en skål med salat</title>
        <defs><radialGradient id="aura-glod"><stop offset="0" stop-color="#FFD54A" stop-opacity="0.9"></stop><stop offset="1" stop-color="#FFD54A" stop-opacity="0"></stop></radialGradient></defs>
        <ellipse class="skaal-bund-skygge" cx="200" cy="275" rx="120" ry="10"></ellipse>
        <g id="kok" class="kok"><g transform="translate(0 -22) scale(1.08) translate(-15 0)">
          <g class="aura" data-fra="8">
            <circle cx="200" cy="0" r="78" fill="url(#aura-glod)"></circle>
            <g class="aura-straaler"><path d="M200 -96 L207 -60 L193 -60 Z M200 96 L207 60 L193 60 Z M104 0 L140 7 L140 -7 Z M296 0 L260 7 L260 -7 Z M132 -68 L162 -46 L154 -38 Z M268 68 L238 46 L246 38 Z M268 -68 L246 -38 L238 -46 Z M132 68 L154 38 L162 46 Z"></path></g>
          </g>
          <path class="kok-krop" d="M118 150 C 116 80, 140 38, 200 34 C 260 38, 284 80, 282 150 Z"></path>
          <path class="kok-knap" d="M200 52 V 140"></path>
          <circle class="kok-knap-prik" cx="188" cy="70" r="3"></circle><circle class="kok-knap-prik" cx="212" cy="70" r="3"></circle>
          <circle class="kok-knap-prik" cx="188" cy="96" r="3"></circle><circle class="kok-knap-prik" cx="212" cy="96" r="3"></circle>
          <rect class="kok-hud" x="188" y="18" width="24" height="20" rx="6"></rect>
          <g class="toerklaede" data-fra="2"><path d="M178 28 L222 28 L200 54 Z"></path><circle cx="200" cy="31" r="6"></circle></g>
          <g class="medalje" data-fra="6"><path d="M222 44 l6 14 l6 -14" class="medalje-baand"></path><circle cx="228" cy="62" r="8"></circle></g>
          <g class="kok-hoved">
            <circle class="kok-hud" cx="200" cy="-2" r="30"></circle>
            <path class="kok-hue" data-til="4" d="M174 -22 h52 v-22 c 14 -4 16 -26 0 -28 c -2 -16 -22 -18 -26 -6 c -6 -12 -26 -10 -26 6 c -16 2 -14 24 0 28 Z"></path>
            <path class="kok-hue" data-fra="4" d="M174 -22 h52 v-40 c 16 -4 18 -30 0 -32 c -2 -18 -24 -20 -26 -6 c -6 -14 -28 -12 -26 6 c -18 2 -16 28 0 32 Z"></path>
            <rect class="hue-baand" data-fra="6" x="174" y="-36" width="52" height="9" rx="2"></rect>
            <path class="krone" data-fra="7" d="M180 -86 l6 -22 l14 13 l14 -13 l6 22 Z"></path>
            <path class="kok-hue-kant" d="M172 -24 h56"></path>
            <circle class="kok-kind" cx="181" cy="8" r="6"></circle><circle class="kok-kind" cx="219" cy="8" r="6"></circle>
            <g class="ansigt-glad">
              <circle class="kok-oeje" cx="189" cy="-4" r="3.6"></circle><circle class="kok-oeje" cx="211" cy="-4" r="3.6"></circle>
              <path class="kok-mund" d="M190 10 q 10 9 20 0"></path>
            </g>
            <path class="overskaeg" data-fra="3" d="M200 6 c -6 -5 -16 -5 -20 2 c 6 -2 12 2 20 1 c 8 1 14 -3 20 -1 c -4 -7 -14 -7 -20 -2 Z"></path>
            <g class="ansigt-ryst">
              <path class="kok-streg" d="M184 -8 l 8 4 l -8 4"></path><path class="kok-streg" d="M216 -8 l -8 4 l 8 4"></path>
              <ellipse class="kok-mund-aaben" cx="200" cy="13" rx="6" ry="7"></ellipse>
            </g>
            <g class="solbriller" data-fra="5"><path d="M180 -10 h18 v8 a 8 8 0 0 1 -18 0 Z M202 -10 h18 v8 a 8 8 0 0 1 -18 0 Z"></path><path class="solbrille-stang" d="M178 -10 h44"></path></g>
          </g>
        </g></g>
        <g id="rystgruppe" class="rystgruppe">
          <path class="kok-aerme-kant" d="M128 44 C 84 56, 50 88, 38 128"></path>
          <path class="kok-aerme-kant" d="M272 44 C 316 56, 350 88, 362 128"></path>
          <path class="kok-aerme" d="M128 44 C 84 56, 50 88, 38 128"></path>
          <path class="kok-aerme" d="M272 44 C 316 56, 350 88, 362 128"></path>
          <ellipse class="skaal-inde" cx="200" cy="132" rx="170" ry="42"></ellipse>
          <g id="indhold"></g>
          <path class="skaal-front" d="M30 132 C 34 222, 118 268, 200 268 C 282 268, 366 222, 370 132 C 318 170, 82 170, 30 132 Z"></path>
          <path class="skaal-kant" d="M30 132 C 82 170, 318 170, 370 132"></path>
          <circle class="kok-hud kok-haand" cx="34" cy="136" r="14"></circle>
          <circle class="kok-hud kok-haand" cx="366" cy="136" r="14"></circle>
        </g>
      </svg>
      <button id="shake" class="shake-knap" type="button">Shake</button>
      <p class="antal"><span id="antal"></span> · <button id="del" class="del-knap" type="button">Del salat</button> <span id="del-status" class="del-status" aria-live="polite"></span></p>
      <div class="titel" id="titel">
        <p class="titel-navn"><span id="titel-navn"></span></p>
        <div class="titel-bar" aria-hidden="true"><span id="titel-fyld"></span></div>
        <p class="titel-tekst" id="titel-tekst"></p>
      </div>
      <p class="ny-titel" id="ny-titel" aria-live="polite"></p>
      <p class="hint" id="hint" hidden>Du kan også ryste telefonen.</p>
    </section>

    <section class="opskrift" aria-labelledby="opskrift-titel">
      <h2 id="opskrift-titel">Din salat</h2>
      <ol id="liste" class="liste" aria-live="polite"></ol>
      <div id="dressing-opskrift" class="dressing-opskrift" hidden>
        <h3>Sådan laver du <span id="dressing-navn"></span></h3>
        <ul id="dressing-liste"></ul>
        <p>Rør det hele sammen, og smag til med salt og peber.</p>
      </div>
    </section>
  </main>

  <section class="galleri" aria-labelledby="galleri-titel">
    <h2 id="galleri-titel">Ingredienserne</h2>
    <div id="galleri" class="galleri-grid"></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
